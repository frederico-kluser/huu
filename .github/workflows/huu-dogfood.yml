# .github/workflows/huu-dogfood.yml — huu audits itself weekly
name: huu dogfood audits

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 0'   # weekly, Sunday 06:00 UTC

# Least privilege: the job reads the repo and runs huu — nothing else.
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HUU_IMAGE: ghcr.io/frederico-kluser/huu:latest
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # First-run setup gate is TTY-safe already; this just silences its notice.
      HUU_SKIP_SETUP: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install huu
        run: npm install -g huu-pipe

      - name: Build config
        run: |
          # `provider` is the credential axis: openrouter spends
          # OPENROUTER_API_KEY. There is no `pi`/`copilot`/`azure` backend —
          # `jcode` serves every provider and `stub` calls no model at all
          # (see AGENTS.md "Backend × provider — two axes, never one").
          cat > huu-ci-config.json <<'EOF'
          {
            "modelId": "x-ai/grok-4-fast",
            "provider": "openrouter"
          }
          EOF

      - name: Run Docs Audit
        run: huu auto pipelines/huu-docs-audit.pipeline.json \
               --config huu-ci-config.json > huu-docs-audit-result.json

      - name: Run Quality Audit
        run: huu auto pipelines/huu-quality-audit.pipeline.json \
               --config huu-ci-config.json > huu-quality-audit-result.json

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: huu-dogfood-audits
          path: |
            .huu/audits/**
            huu-docs-audit-result.json
            huu-quality-audit-result.json

      - name: Gate on results
        if: always()
        run: |
          jq -e '.ok == true' huu-docs-audit-result.json
          jq -e '.ok == true' huu-quality-audit-result.json
