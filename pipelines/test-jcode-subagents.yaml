# test-jcode-subagents.yaml
# Smoke-test pipeline: validates the jcode backend with real sub-agents running
# in parallel. Each agent is a `jcode run` subprocess spawned by the huu
# orchestrator (src/orchestrator/backends/jcode/factory.ts).
#
# Format: huu-pipeline-v2 (human-readable YAML — the bash test script ingests
# this spec and either converts it to a runnable JSON pipeline or spawns the
# agents directly via `jcode run` in parallel subprocesses.)

_format: "huu-pipeline-v2"
exportedAt: "2026-08-04T00:00:00.000Z"

pipeline:
  name: "JCode Sub-Agent Smoke Test"
  description: >
    Spawns 3 trivial sub-agents in parallel via the jcode backend. Each agent
    performs a single-file write task. The test harness verifies all outputs
    exist after the run completes. Backend: jcode (child_process.spawn of
    `jcode run --no-update --provider-profile deepseek-v4-pro`).
    Memory: disabled (JCODE_MEMORY_ENABLED=false, zero embeddings).
  maxRetries: 0
  maxNodeExecutions: 6

  steps:
    # ── Agent 1: write a README -------

    - type: work
      name: "agent-readme"
      modelId: deepseek-v4-pro
      prompt: |
        You are agent-readme — a single-purpose test agent in the jcode-subagents smoke test.

        === YOUR TASK ===
        Create a file named OUTPUT_README.md in the current working directory.

        The file must contain EXACTLY this content:
        ```
        # JCode Sub-Agent Smoke Test
        Generated by agent-readme via jcode backend.

        This file was created as part of the jcode-backend validation pipeline.
        ```

        === RULES ===
        - Use the Write tool to create OUTPUT_README.md.
        - Do NOT read, edit, or delete any other files.
        - After writing, output the marker "[agent-readme] DONE" as your last line.

        === CONTRACT ===
        The test harness expects a single file: OUTPUT_README.md with the content above.
      files: []
      scope: project
      writes:
        - OUTPUT_README.md

    # ── Agent 2: write a counter -------

    - type: work
      name: "agent-counter"
      modelId: deepseek-v4-pro
      prompt: |
        You are agent-counter — a single-purpose test agent in the jcode-subagents smoke test.

        === YOUR TASK ===
        Create a file named OUTPUT_COUNTER.txt in the current working directory.

        The file must contain the numbers 1 through 5, one per line, like this:
        ```
        1
        2
        3
        4
        5
        ```

        === RULES ===
        - Use the Write tool to create OUTPUT_COUNTER.txt.
        - Do NOT read, edit, or delete any other files.
        - After writing, output the marker "[agent-counter] DONE" as your last line.

        === CONTRACT ===
        The test harness expects a single file: OUTPUT_COUNTER.txt with exactly 5 lines (1-5).
      files: []
      scope: project
      writes:
        - OUTPUT_COUNTER.txt

    # ── Agent 3: directory listing -------

    - type: work
      name: "agent-listing"
      modelId: deepseek-v4-pro
      prompt: |
        You are agent-listing — a single-purpose test agent in the jcode-subagents smoke test.

        === YOUR TASK ===
        1. Run `ls -la` in the current working directory.
        2. Create a file named OUTPUT_LISTING.md containing the directory listing output.

        The file should look like:
        ```
        # Directory Listing
        Generated by agent-listing via jcode backend.

        ## Files in working directory
        ```
        (followed by the output from the `ls -la` command)

        === RULES ===
        - Use the Bash tool to run `ls -la`.
        - Use the Write tool to create OUTPUT_LISTING.md with the listing output.
        - Do NOT read, edit, or delete any other files.
        - After writing, output the marker "[agent-listing] DONE" as your last line.

        === CONTRACT ===
        The test harness expects a single file: OUTPUT_LISTING.md containing the directory listing.
      files: []
      scope: project
      writes:
        - OUTPUT_LISTING.md
